name: mod check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      # `claude plugin validate` lists each mod's hooks and Mods API calls
      - run: npm install -g @anthropic-ai/claude-code@2.1.289
      # every plugin at its pinned version: signatures, install scripts, static guard, and
      # CAPABILITIES.md must match what the mods actually do
      - run: node scripts/check-mods.mjs --check
