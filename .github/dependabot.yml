version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # TypeScript 7 drops the compiler API that scripts/check-mods.mjs parses with
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
